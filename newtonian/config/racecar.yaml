newtonian:

  ros__parameters:

    sim:
      cuda_graph: true
      device: "cuda:0"                  # 'cpu' | 'cuda:0'
      viewer: "gl"                      # 'gl' | 'none'
      substeps: 4
      frame_rate: 45.0                  # Hz
      real_time_factor: 1.0

    solver:
      type: "mujoco"                    # 'featherstone' | 'kamino' | 'mujoco' | 'xpbd'

      mujoco:
        iterations: 50
        ls_iterations: 50
        cone: "elliptic"
        impratio: 10.0

      # 'featherstone' stable only for large substeps
      # 'kamino' not recommended for racecar
      # 'xpbd' not supported for racecar

    environments:                       # multiple environments supported; wall_height in m
      ground: {type: "groundplane", mu: 1.0}
      track: {type: "track", map: "package://newtonian/descriptions/racecar/tracks/poire/poire.yaml", wall_height: 0.3, color: [0.5, 0.5, 0.5]}

    robots:
      racecar:                          # name of robot (in case of multiple)
        type: "mjcf"                    # 'mjcf' | 'urdf' | 'usd'
        file: "package://newtonian/descriptions/racecar/racecar.xml"
        pose: [0.0, -7.5, 0.0, 0.0, 0.0, 0.0]  # m, rad: x, y, z, roll, pitch, yaw
        floating: true                  # default for floating base robot
        loader_args:
          enable_self_collisions: false
          force_show_colliders: true    # required for ui
        drives:                         # 'none' | 'position' | 'velocity' | 'position_velocity' | 'effort'; ke N·m/rad, kd N·m·s/rad, effort_limit N·m
          wheels: {joints: "*_wheel_joint", mode: "velocity", ke: 0.0, kd: 2.0, effort_limit: 5.0}
          steering: {joints: "*_steer_joint", mode: "position", ke: 20.0, kd: 0.5}
        colors:                         # shapes: glob on shape names; color: [r, g, b], 0 to 1
          chassis: {shapes: "chassis", color: [0.6, 0.14, 0.2]}
          lidar: {shapes: "lidar_body", color: [0.08, 0.07, 0.08]}
          wheels: {shapes: "*_wheel_geom_*", color: [0.08, 0.07, 0.08]}

    sensors:                            # name of sensor (also the default topic); rate in Hz
      imu: {type: "imu", site: "imu", rate: 200.0, topic: "/racecar/sensors/imu"}
      scan: {type: "lidar", site: "laser", rate: 40.0, topic: "/racecar/sensors/laserscan"}
      odom: {type: "odometry", child_frame_id: "base_link", rate: 45.0, topic: "/racecar/sensors/odometry"}
      joint_states: {type: "jointstate", rate: 45.0, topic: "/racecar/sensors/jointstate"}

    inputs:
      
      racecar:                          # name of input (in case of multiple)
        type: "racecar"
        topic: "/racecar/control"
        wheel_radius: 0.05              # m
        wheelbase: 0.33                 # m
        max_speed: 8.0                  # m/s
        timeout: 0.5                    # s
        track: 0.24                     # m
        steer_joints: {left: "front_left_steer_joint", right: "front_right_steer_joint"}
        wheel_joints:
          front_left: "front_left_wheel_joint"
          front_right: "front_right_wheel_joint"
          rear_left: "rear_left_wheel_joint"
          rear_right: "rear_right_wheel_joint"

      rollouts:                         # visualization of mppi controller
        type: "markers"
        topic: "/racecar/debug/rollouts"
        timeout: 0.5
        line_width: 3.0
