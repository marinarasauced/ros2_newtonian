newtonian:

  ros__parameters:

    sim:
      cuda_graph: true
      device: "cuda:0"                  # 'cpu' | 'cuda:0'
      viewer: "gl"                      # 'gl' | 'none'
      substeps: 4
      frame_rate: 60.0                  # Hz
      real_time_factor: 1.0

    solver:
      type: "mujoco"                    # 'featherstone' | 'kamino' | 'mujoco' | 'xpbd'

      mujoco:
        iterations: 50
        ls_iterations: 50
        cone: "elliptic"
        impratio: 100.0
        nconmax: 200
        njmax: 600

    environments:
      ground: {type: "groundplane", mu: 1.0, color: [0.474, 0.470, 0.474]}

    robots:
      unitree_go2:
        type: "mjcf"
        file: "package://newtonian/descriptions/quadrupeds/unitree_go2/go2.xml"
        pose: [0.0, 0.0, -0.172, 0.0, 0.0, 0.0]
        floating: true
        loader_args:
          enable_self_collisions: false
        drives:
          hips_and_thights: {joints: ["*_hip_joint", "*_thigh_joint"], lazy: true, mode: "position_velocity", ke: 100.0, kd: 2.0, effort_limit: 23.7}
          calves: {joints: "*_calf_joint", lazy: true, mode: "position_velocity", ke: 100.0, kd: 2.0, effort_limit: 45.43}
        initial_joint_q:
          "*_hip_joint": 0.0
          "*_thigh_joint": 0.9
          "*_calf_joint": -1.8

    sensors:                            # name of sensor (also the default topic); rate in Hz
      imu: {type: "imu", site: "imu", rate: 100.0, topic: "/go2/sensors/imu"}
      odom: {type: "odometry", child_frame_id: "base_link", rate: 100.0, topic: "/go2/sensors/odometry"}
      joint_states: {type: "jointstate", joints: ["FR_*", "FL_*", "RR_*", "RL_*"], rate: 100.0, topic: "/go2/sensors/jointstate"}
      feet: {type: "contact_force", bodies: ["FL_calf", "FR_calf", "RL_calf", "RR_calf"], rate: 100.0, topic: "/go2/sensors/feet"}

    inputs:
      
      joint_targets:
        type: "jointstate"
        topic: "/go2/control"
